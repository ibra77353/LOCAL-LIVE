# البرنس لايف — إعداد Nginx مبني على ملف nginx.conf الافتراضي المرفق.
# أُبقيَ الهيكل الافتراضي كما هو (worker_processes 1، worker_connections 1024،
# include mime.types، sendfile، keepalive_timeout) بدون أوامر ضبط إضافية،
# وأُضيفت فقط المواقع اللازمة لعمل البث ولوحة التحكم عبر خادم Node.

worker_processes  1;

# سجلّ الأخطاء يقرأه خادم Node لتشخيص فشل الربط بالمنفذ بدل فشل صامت.
# المستوى info يضيف تفاصيل الاتصالات وردود الخادم الخلفي، وهو ما يلزم لتتبّع
# فشل تشغيل القنوات من أجهزة خارجية (انقطاع الاتصال، 502/504، انتهاء المهلة).
error_log  logs/error.log info;


# على ويندوز يبقى العامل القديم «قيد الانسحاب» ما دامت لديه اتصالات keep-alive،
# فتتراكم عمليات nginx.exe مع كل إعادة تشغيل. هذه المهلة تُنهيه خلال 10 ثوانٍ.
worker_shutdown_timeout 10s;

events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    # سجل وصول مفصّل: يوضّح كل طلب قادم من الأجهزة الخارجية — العنوان، المسار،
    # رمز الحالة، زمن الطلب، ردّ خادم Node الخلفي، والمرجع والمتصفح — حتى يظهر
    # سبب فشل التشغيل أو انقطاع المشاهدة مباشرةً في السجل.
    log_format  main    '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                        'host=$host xff="$http_x_forwarded_for" rt=$request_time '
                        'upstream=$upstream_addr ust=$upstream_status urt=$upstream_response_time';

    # سجل البث: كل طلب HLS مع زمن الاستجابة وحالة الخادم الخلفي.
    log_format  stream  '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                        'rt=$request_time upstream=$upstream_addr ust=$upstream_status urt=$upstream_response_time';

    # ملفات السجلات نسبية إلى مجلد nginx: access.log لكل الطلبات،
    # وstream.log لطلبات البث HLS وحدها ليسهل قراءة سلوك المشاهدين الخارجيين.
    access_log  logs/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  _;

        # قوائم m3u8 تمرّ عبر Node لا تُخدَم من القرص مباشرةً: هذا هو مسار
        # heartbeat الذي يمنع إيقاف القناة التي يشاهدها أحد عبر رابط HLS مباشر.
        location ~ ^/hls/.+\.m3u8$ {
            access_log  logs/stream.log  stream;
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # مقاطع .ts تُخدَم من القرص مباشرةً. لا نضع location متداخلاً تحت alias:
        # nginx لا يورّث الـalias للمواقع المتداخلة فتُخدَم المقاطع من html/ → 404.
        # طلبات المقاطع تُسجَّل في stream.log (بلا إيقاف للسجل) لأن رمز 404 هنا
        # هو أول ما يكشف فشل مشاهدة خارجية أو مقاطع لم تُنشأ بعد.
        location /hls/ {
            alias ../srv/hls/;
            access_log  logs/stream.log  stream;
            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location /uploads/ {
            alias ../srv/uploads/;
            access_log off;
            add_header Cache-Control "max-age=3600";
        }

        location / {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300;
            client_max_body_size 2048m;
        }
    }
}
